# Checkov runs in the infra pipeline and fails the build on any check not listed here.
# Every skip is a conscious trade-off for a low-cost, single-node portfolio environment.
skip-check:
  - CKV_AWS_119   # DynamoDB CMK: AWS-owned key encryption is on; a customer KMS key costs $1/month each
  - CKV_AWS_136   # ECR KMS: AES256 encryption is on; customer KMS key not needed here
  - CKV_AWS_145   # State bucket KMS: SSE-S3 (AES256) is on
  - CKV_AWS_273   # IAM user instead of SSO: Azure DevOps AWS service connection uses access keys (OIDC is on the roadmap)
  - CKV_AWS_40    # Inline policy on that CI user: one user, one tightly scoped policy
  - CKV_AWS_260   # Port 80 open: the dashboard is meant to be public (restrict with allowed_http_cidrs)
  - CKV_AWS_382   # Open egress: the worker health-checks arbitrary public URLs
  - CKV_AWS_394   # AZ pinning: single-AZ on purpose, subnet uses names[0]
  - CKV2_AWS_11   # VPC flow logs: skipped to keep CloudWatch ingestion cost at zero
  - CKV_AWS_18    # State bucket access logging: not needed for a personal state bucket
  - CKV_AWS_144   # State bucket cross-region replication: versioning covers recovery here
  - CKV2_AWS_62   # State bucket event notifications: nothing consumes them
