# Local dev: app + DynamoDB Local. Run: docker compose up --build  -> http://localhost:8000
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports: ["8001:8000"]
  init-table:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-west-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 3;
        aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name cloudpulse-local
        --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S
        --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
        --billing-mode PAY_PER_REQUEST || true
  app:
    build: .
    depends_on: [init-table]
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      ROLE: all
      TABLE_NAME: cloudpulse-local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-1
      CHECK_INTERVAL_SECONDS: "20"
