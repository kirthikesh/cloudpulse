# Only ingress traffic from Traefik (kube-system) may reach the API pods. Worker accepts nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default
  labels: {{- include "cloudpulse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cloudpulse.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8000
