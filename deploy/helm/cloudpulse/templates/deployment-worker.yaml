{{- if .Values.worker.enabled }}
# Exactly one worker per environment so each URL is checked once per interval.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate   # never two workers at once
  selector:
    matchLabels:
      {{- include "cloudpulse.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "cloudpulse.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "cloudpulse.podSecurity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "cloudpulse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ROLE
              value: worker
            - name: CHECK_INTERVAL_SECONDS
              value: {{ .Values.worker.checkIntervalSeconds | quote }}
            - name: CHECK_TIMEOUT_SECONDS
              value: {{ .Values.worker.checkTimeoutSeconds | quote }}
            - name: RESULT_TTL_DAYS
              value: {{ .Values.worker.resultTtlDays | quote }}
            {{- include "cloudpulse.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "cloudpulse.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
{{- end }}
