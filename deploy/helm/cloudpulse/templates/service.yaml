apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "cloudpulse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cloudpulse.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
